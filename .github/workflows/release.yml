name: CodexRemote-fix release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to rebuild and publish
        required: true
        type: string

concurrency:
  group: ccod-draft-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - name: Validate release tag
        id: release
        shell: pwsh
        env:
          CCOD_RELEASE_TAG_INPUT: ${{ inputs.tag }}
        run: |
          $tag = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { [string]$env:CCOD_RELEASE_TAG_INPUT } else { [string]$env:GITHUB_REF_NAME }
          if ($tag -cnotmatch '^v\d+\.\d+\.\d+\z') {
            throw "Release tag must be canonical vX.Y.Z; received '$tag'."
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Check out the validated release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 1

      - name: Resolve immutable release commit
        id: commit
        shell: pwsh
        run: |
          $commit = ([string](& git rev-parse HEAD)).Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $commit -cnotmatch '^[0-9a-f]{40}$') {
            throw "Release tag did not resolve to a canonical commit: '$commit'."
          }
          "commit=$commit" >> $env:GITHUB_OUTPUT

  preflight:
    needs: prepare
    outputs:
      tag: ${{ needs.prepare.outputs.tag }}
      commit: ${{ needs.prepare.outputs.commit }}
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Run clean release runner
        shell: pwsh
        env:
          CCOD_RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          $tag = $env:CCOD_RELEASE_TAG
          if ($tag -cnotmatch '^v\d+\.\d+\.\d+\z') {
            throw "Release tag output is invalid: '$tag'."
          }
          $version = $tag.Substring(1)
          Import-Module (Join-Path $PWD 'tools\Test-CleanReleaseRunner.psm1') -Force -DisableNameChecking
          $result = Test-CcodCleanReleaseRunner -RepositoryRoot $PWD -ExpectedVersion $version
          $artifact = Join-Path $PWD 'build\preflight\clean-preflight.json'
          New-Item -ItemType Directory -Path (Split-Path $artifact -Parent) -Force | Out-Null
          Copy-Item -LiteralPath $result.PreflightPath -Destination $artifact -Force

      - name: Upload immutable clean preflight evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CodexRemote-fix clean preflight
          path: build/preflight/clean-preflight.json
          if-no-files-found: error

  build:
    needs: preflight
    outputs:
      tag: ${{ needs.preflight.outputs.tag }}
      commit: ${{ needs.preflight.outputs.commit }}
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.preflight.outputs.commit }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Run repository validation
        shell: pwsh
        run: npm test

      - name: Run deterministic installed lifecycle harness tests
        shell: pwsh
        run: npm run test:installed-lifecycle

      - name: Run release contract tests
        shell: pwsh
        run: npm run test:release-contract

      - name: Run source-identical TrayHost smoke
        shell: pwsh
        run: ./tests/trayhost/Invoke-TrayHostSelfTest.ps1 -ProductionOnly

      - name: Run authenticated TrayHost production trace
        shell: pwsh
        run: ./tests/trayhost/Invoke-TrayHostSelfTest.ps1 -ProductionTraceOnly

      - name: Build CodexRemote-fix portable bundle
        shell: pwsh
        env:
          CCOD_RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          $version = $env:CCOD_RELEASE_TAG.Substring(1)
          ./build/build.ps1 -Version $version

      - name: Upload immutable CodexRemote-fix portable bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CodexRemote-fix portable bundle
          path: build/dist
          if-no-files-found: error

  stage:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.build.outputs.commit }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Download immutable CodexRemote-fix portable bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: CodexRemote-fix portable bundle
          path: build/dist

      - name: Download immutable clean preflight evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: CodexRemote-fix clean preflight
          path: build/preflight

      - name: Materialize transferred clean preflight evidence
        shell: pwsh
        env:
          CCOD_RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          $tag = $env:CCOD_RELEASE_TAG
          $version = $tag.Substring(1)
          $source = Join-Path $PWD 'build\preflight\clean-preflight.json'
          $evidence = Join-Path $env:RUNNER_TEMP 'ccod-draft-evidence'
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          Copy-Item -LiteralPath $source -Destination (Join-Path $evidence ("CodexRemote-fix-$version-clean-preflight.json")) -Force

      - name: Verify downloaded release candidate contract
        shell: pwsh
        env:
          CCOD_RELEASE_TAG: ${{ needs.build.outputs.tag }}
          CCOD_RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          npm run test:release-contract
          $tag = $env:CCOD_RELEASE_TAG
          if ($tag -cnotmatch '^v\d+\.\d+\.\d+\z') {
            throw "Release tag output is invalid: '$tag'."
          }
          $version = $tag.Substring(1)
          Import-Module (Join-Path $PWD 'tools\ReleaseAssetContract.psm1') -Force
          $names = @(Get-CcodExpectedReleaseAssetNames -Version $version)
          $candidate = Test-CcodExactReleaseAssetSet -AssetDirectory (Join-Path $PWD 'build/dist') -Version $version
          if ($env:CCOD_RELEASE_COMMIT -cnotmatch '^[0-9a-f]{40}\z' -or $candidate.GitCommit -cne $env:CCOD_RELEASE_COMMIT) {
            throw 'CCOD_RELEASE_BUILD_COMMIT_MISMATCH'
          }
          $manifestPath = Join-Path $PWD ('build\dist\CodexRemote-fix-' + $version + '-release-manifest.json')
          Test-CcodReleaseAssetManifest -ManifestPath $manifestPath -AssetDirectory (Join-Path $PWD 'build\dist') -ExpectedVersion $version | Out-Null
          $setupManifestPath = Join-Path $PWD ('build\dist\CodexRemote-fix-' + $version + '-setup-release-manifest.json')
          Test-CcodReleaseAssetManifest -ManifestPath $setupManifestPath -AssetDirectory (Join-Path $PWD 'build\dist') -ExpectedVersion $version | Out-Null
          if ($names.Count -ne 11) {
            throw 'Release candidate does not expose the exact 11 public names.'
          }

      - name: Stage private GitHub draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          CCOD_RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          $tag = $env:CCOD_RELEASE_TAG
          if ($tag -cnotmatch '^v\d+\.\d+\.\d+\z') {
            throw "Release tag output is invalid: '$tag'."
          }
          $version = $tag.Substring(1)
          $notesPath = Join-Path $env:RUNNER_TEMP ("CodexRemote-fix-$tag-release-notes.md")
          & (Join-Path $PWD 'tools\New-GitHubReleaseNotes.ps1') -ChangelogPath (Join-Path $PWD 'CHANGELOG.md') -Tag $tag -OutputPath $notesPath | Out-Null
          $evidence = Join-Path $env:RUNNER_TEMP 'ccod-draft-evidence'
          $preflight = Join-Path $evidence ("CodexRemote-fix-$version-clean-preflight.json")
          if (-not (Test-Path -LiteralPath $preflight -PathType Leaf)) {
            throw "Transferred clean preflight evidence is missing: '$preflight'."
          }
          Import-Module (Join-Path $PWD 'tools\Invoke-GitHubDraftRelease.psm1') -Force -DisableNameChecking
          Invoke-CcodGitHubDraftRelease -Mode Stage -Tag $tag -AssetDirectory (Join-Path $PWD 'build\dist') -EvidenceDirectory $evidence -NotesPath $notesPath | Out-Null
          Invoke-CcodGitHubDraftRelease -Mode Verify -Tag $tag -AssetDirectory (Join-Path $PWD 'build\dist') -EvidenceDirectory $evidence | Out-Null
