name: DIAG release build gate

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Release build gate
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Build CodexRemote-fix portable bundle
        shell: pwsh
        env:
          CCOD_RELEASE_TAG: v2.5.22
        run: |
          $version = $env:CCOD_RELEASE_TAG.Substring(1)
          ./build/build.ps1 -Version $version

      - name: Report bundle
        if: always()
        shell: pwsh
        run: |
          if (Test-Path build/dist) {
            Get-ChildItem -Recurse build/dist | Select-Object FullName, Length | Format-Table -AutoSize | Out-String -Width 200
          } else { Write-Output 'NO_DIST' }
