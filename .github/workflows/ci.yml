name: CodexRemote-fix CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Windows validation
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Run uninstall bootstrap self-test
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./tests/persistence/UninstallBootstrap.SelfTest.ps1

      - name: Run repository validation
        shell: pwsh
        run: npm test

      - name: Run deterministic installed lifecycle harness tests
        shell: pwsh
        run: npm run test:installed-lifecycle

      - name: Run release contract tests
        shell: pwsh
        run: npm run test:release-contract

      - name: Run TrayHost protocol self-test
        shell: pwsh
        run: ./tests/trayhost/Invoke-TrayHostSelfTest.ps1 -ProtocolOnly

      - name: Run production TrayHost smoke test
        shell: pwsh
        run: ./tests/trayhost/Invoke-TrayHostSelfTest.ps1 -ProductionOnly

      - name: Run authenticated TrayHost production trace
        shell: pwsh
        run: ./tests/trayhost/Invoke-TrayHostSelfTest.ps1 -ProductionTraceOnly
