name: DIAG build fix

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build fix verification
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: CI-exact portable bundle build under pwsh
        if: always()
        shell: pwsh
        env:
          CCOD_RELEASE_TAG: v2.5.22
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          try {
            $version = $env:CCOD_RELEASE_TAG.Substring(1)
            ./build/build.ps1 -Version $version
            Write-Output 'CI_EXACT_OK'
          } catch {
            Write-Output ("CI_EXACT_EXCEPTION=" + $_.Exception.GetType().FullName + ':' + $_.Exception.Message)
            Write-Output ("CI_EXACT_STACK=" + ([string]$_.ScriptStackTrace).Replace("`r",' ').Replace("`n",' | '))
          }
          $sw.Stop()
          Write-Output ("BUILD_SECONDS=" + [int]$sw.Elapsed.TotalSeconds)
          if (Test-Path build/dist) { Get-ChildItem build/dist | Select-Object -Expand Name } else { Write-Output 'NO_DIST' }
          exit 0

      - name: Release contract suite
        if: always()
        shell: pwsh
        run: |
          npm run test:release-contract
          exit 0
